# firefox wayland screensharing indicator
for_window [app_id="firefox" title="Firefox — Sharing Indicator"] {
    floating enable
}

# Display PulseAudio volume control application as a floating window.
for_window [app_id="^(pavucontrol|lxqt-policykit-agent)$"] {
    floating enable
    move position center
}

for_window [class="xPilot"] floating enable

# Inhibit idle for any fullscreen window (ex games)
for_window [class="^.*"] inhibit_idle fullscreen
for_window [app_id="^.*"] inhibit_idle fullscreen
